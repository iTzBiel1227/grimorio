[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Navigation and login return URLs use physical .html pages.
[build.processing.html]
  pretty_urls = false

# This is not a React SPA: there is no catch-all rewrite to index.html.
# The build uses supabase/frontend.json (URL and public publishable key only).
# Optional overrides: SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY together.
# GRIMORIO_BACKEND=sqlite explicitly builds the original Node-backed interface.
