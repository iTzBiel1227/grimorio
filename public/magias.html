<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magias — Grimório</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/platform.css"></head><body><aside class="app-sidebar"><a class="side-brand" href="/"><span class="sigil"><i>✦</i></span><span class="brand-copy">GRIMÓRIO<b>.</b></span></a><nav class="side-nav"><a class="side-link " href="/"><span class="ico">⌂</span><span>Início</span></a><a class="side-link " href="/amigos.html"><span class="ico">♙</span><span>Amigos</span></a><a class="side-link " href="/campanha.html"><span class="ico">⚔</span><span>Campanhas</span></a><a class="side-link " href="/ficha.html"><span class="ico">▤</span><span>Fichas</span></a><a class="side-link active" href="/magias.html"><span class="ico">✦</span><span>Magias</span></a><a class="side-link " href="/livros.html"><span class="ico">▣</span><span>Livros</span></a></nav><div class="side-bottom"><a class="side-link " href="/sugestoes.html"><span class="ico">✎</span><span>Sugestões</span></a></div></aside><div class="app-main"><main class="page-shell"><header class="page-head"><div><span class="mini-label">ARSENAL DO PERSONAGEM</span><h1>Magias</h1><p>Crie sua biblioteca uma vez e reutilize magias e habilidades nas fichas.</p></div><button id="newEntry" class="button button-primary">+ Criar</button></header><div class="magic-tabs"><button class="button button-primary tab" data-kind="spell">Magias</button><button class="button button-secondary tab" data-kind="ability">Habilidades</button></div><section id="creator" class="panel form-card hidden"><form id="entryForm"><input type="hidden" id="kind" value="spell"><label>Nome</label><input id="entryName" required><label>Descrição</label><textarea id="description" rows="5"></textarea><label>Dano / efeito</label><input id="damage" placeholder="Ex.: 2d8 + Poder"><button class="button button-primary">Salvar</button></form></section><div id="entries" class="grid-cards" style="margin-top:20px"></div></main></div><div id="toast" class="toast hidden"></div><script src="/socket.io/socket.io.js"></script><script src="/shell.js"></script><script>(async()=>{const {api,esc}=Grimorio;if(!await Grimorio.currentUser())return Grimorio.loginRedirect();let active='spell';async function load(){const d=await api('/api/grimoire');const list=d.entries.filter(x=>x.kind===active);entries.innerHTML=list.map(x=>`<article class="panel magic-card ${x.isStandard?'standard':''}"><span class="mini-label">${x.isStandard?'PADRÃO DO LIVRO':'MINHA CRIAÇÃO'}</span><h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><strong>${esc(x.damage||'Sem dano definido')}</strong>${x.isStandard?'':`<div style="margin-top:12px"><button class="button button-secondary del" data-id="${x.id}">Excluir</button></div>`}</article>`).join('')||'<div class="panel empty-panel">Nenhum registro nesta categoria.</div>';document.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{await api('/api/grimoire/'+b.dataset.id,{method:'DELETE'});load()})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.kind;kind.value=active;document.querySelectorAll('.tab').forEach(x=>x.className='button button-secondary tab');b.className='button button-primary tab';load()});newEntry.onclick=()=>creator.classList.toggle('hidden');entryForm.onsubmit=async e=>{e.preventDefault();await api('/api/grimoire',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:active,name:entryName.value,description:description.value,damage:damage.value})});entryForm.reset();kind.value=active;creator.classList.add('hidden');load()};load()})()</script></body></html>
